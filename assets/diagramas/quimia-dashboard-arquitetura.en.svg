<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-label="Quimia Dashboard architecture"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#10264f"/></linearGradient><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 8 4.5 1 8z" fill="#58a6ff"/></marker></defs><style>.flow{stroke-dasharray:5 6;animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-11}}@media (prefers-reduced-motion:reduce){.flow,.lit{animation:none}}</style><rect width="960" height="530" rx="14" fill="url(#bg)"/><g font-family="'Segoe UI',-apple-system,Helvetica,Arial,sans-serif"><rect x="725" y="36" width="200" height="118" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#2b4378" stroke-width="1.4"/><text x="743" y="67" font-size="14.5" font-weight="700" fill="#e6edf3">Browser</text><text x="743" y="92" font-size="12.2" fill="#9fb3d1">JS, Chart.js and SheetJS</text><text x="743" y="109" font-size="12.2" fill="#9fb3d1">Charts and export</text><text x="743" y="126" font-size="12.2" fill="#9fb3d1">run here</text><rect x="495" y="36" width="200" height="118" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#2b4378" stroke-width="1.4"/><text x="513" y="67" font-size="14.5" font-weight="700" fill="#e6edf3">Supabase</text><text x="513" y="92" font-size="12.2" fill="#9fb3d1">Auth (email and password)</text><text x="513" y="109" font-size="12.2" fill="#9fb3d1">and PostgREST: direct</text><text x="513" y="126" font-size="12.2" fill="#9fb3d1">queries, no extra API</text><rect x="265" y="36" width="200" height="118" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#58a6ff" stroke-width="1.4"/><text x="283" y="67" font-size="14.5" font-weight="700" fill="#e6edf3">Postgres with RLS</text><text x="283" y="92" font-size="12.2" fill="#9fb3d1">8 tables queried</text><text x="283" y="109" font-size="12.2" fill="#9fb3d1">Rows only for</text><text x="283" y="126" font-size="12.2" fill="#9fb3d1">registered employees</text><rect x="35" y="36" width="200" height="86" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#2b4378" stroke-width="1.4"/><text x="53" y="67" font-size="14.5" font-weight="700" fill="#e6edf3">task-time-sync</text><text x="53" y="92" font-size="12.2" fill="#9fb3d1">Separate pipeline that</text><text x="53" y="109" font-size="12.2" fill="#9fb3d1">writes the data to Postgres</text><path class="flow" d="M723 95.0 L699 95.0" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><path class="flow" d="M493 95.0 L469 95.0" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><path class="flow" d="M237 79 L261 79" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><rect x="495" y="232" width="200" height="86" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#2b4378" stroke-width="1.4"/><text x="513" y="263" font-size="14.5" font-weight="700" fill="#e6edf3">Excel</text><text x="513" y="288" font-size="12.2" fill="#9fb3d1">Power Query with a</text><text x="513" y="305" font-size="12.2" fill="#9fb3d1">revocable key (qxl_)</text><rect x="725" y="232" width="200" height="118" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#2b4378" stroke-width="1.4"/><text x="743" y="263" font-size="14.5" font-weight="700" fill="#e6edf3">Pages Functions</text><text x="743" y="288" font-size="12.2" fill="#9fb3d1">Cloudflare</text><text x="743" y="305" font-size="12.2" fill="#9fb3d1">download-planilha and</text><text x="743" y="322" font-size="12.2" fill="#9fb3d1">download-dashboard</text><path class="flow" d="M697 275 L721 275" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><path class="flow" d="M825.0 156 L825.0 228" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><text x="859.0" y="197.0" text-anchor="middle" font-size="11.2" fill="#58a6ff">downloads</text><rect x="725" y="394" width="200" height="90" rx="12" fill="#ffffff" fill-opacity=".045" stroke="#2b4378" stroke-width="1.4"/><text x="743" y="425" font-size="14.5" font-weight="700" fill="#e6edf3">Backblaze B2</text><text x="743" y="450" font-size="12.2" fill="#9fb3d1">Workbooks; credentials</text><text x="743" y="467" font-size="12.2" fill="#9fb3d1">stay on the server</text><path class="flow" d="M825.0 352 L825.0 390" stroke="#58a6ff" stroke-width="2" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><text x="35" y="512" font-size="12.5" fill="#9fb3d1" text-anchor="start" font-weight="400" letter-spacing="0">Access control lives in the database. The public Supabase key in the code alone grants access to no rows.</text></g></svg>